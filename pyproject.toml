[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "tsukimiso"
description = "An OSS federated learning framework designed for production use"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "torchvision",
    "opacus",
    "safetensors",
    "numpy",
    "PyYAML",
    "omegaconf",
    "starlette",
    "uvicorn[standard]",
    "pydantic",
    "websocket-client",
    "requests",
    "protobuf"
]
dynamic = ["version"]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0"

[project.scripts]
tsukimiso = "tsukimiso.server:run"
