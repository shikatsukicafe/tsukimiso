[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsukimiso"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "torchvision",
    "opacus",
    "numpy",
    "PyYAML",
    "omegaconf",
    "starlette",
    "uvicorn[standard]",
    "pydantic",
    "websocket-client",
    "requests",
    "protobuf"
]

[project.scripts]
tsukimisrv = "tsukimiso.server:run"
